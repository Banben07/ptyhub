<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="ptyhub">
  <title>ptyhub</title>
  <!--
    The static favicon: deliberately simpler than the app icon because at 16 px
    only the chevron and the cursor survive. Adapts to the browser's tab colour
    so it stays legible in both light and dark chrome. Once the app loads it
    swaps this for a live one that also reports connection state.
  -->
  <style>
    .tile { fill: #12151d }
    .beam { stroke: #7aa2ff }
    .cursor { fill: #e6eaf2 }
    @media (prefers-color-scheme: light) {
      .tile { fill: #2f6fed }
      .beam { stroke: #ffffff }
      .cursor { fill: #ffffff }
    }
  </style>
  <rect class="tile" width="32" height="32" rx="8"/>
  <path class="beam" d="M9.5 10.5 L15 16 L9.5 21.5" fill="none" stroke-width="3.4"
        stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="cursor" x="17" y="18.6" width="8.5" height="3.2" rx="1.6"/>
</svg>
